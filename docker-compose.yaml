services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      R2DBC_URL: r2dbc:postgresql://db:5432/my_market_app
      JDBC_URL: jdbc:postgresql://db:5432/my_market_app
      DB_USERNAME: market
      DB_PASSWORD: market
      DB_SCHEMA: public
      IMAGES_ROOT: /app/images
      INSERT_DEMO_DATA: true
      REDIS_HOST: redis
      PAYMENT_BASE_URL: http://payments:8081
    volumes:
      - ./images:/app/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      payments:
        condition: service_started

  payments:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PAYMENT_INITIAL_BALANCE: ${PAYMENT_INITIAL_BALANCE:-100000.00}

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: my_market_app
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
