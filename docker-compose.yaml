services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      R2DBC_URL: r2dbc:postgresql://db:5432/my_market_app
      JDBC_URL: jdbc:postgresql://db:5432/my_market_app
      DB_USERNAME: market
      DB_PASSWORD: market
      DB_SCHEMA: public
      IMAGES_ROOT: /app/images
      INSERT_DEMO_DATA: true
    volumes:
      - ./images:/app/images
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: my_market_app
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
