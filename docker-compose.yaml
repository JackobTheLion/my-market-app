services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      R2DBC_URL: r2dbc:postgresql://db:5432/my_market_app
      JDBC_URL: jdbc:postgresql://db:5432/my_market_app
      DB_USERNAME: market
      DB_PASSWORD: market
      DB_SCHEMA: public
      IMAGES_ROOT: /app/images
      INSERT_DEMO_DATA: true
      REDIS_HOST: redis
      PAYMENT_BASE_URL: http://payments:8081
      KEYCLOAK_TOKEN_URI: http://keycloak:8080/realms/market/protocol/openid-connect/token
      MARKET_CLIENT_SECRET: ${MARKET_CLIENT_SECRET:-market-local-secret}
    volumes:
      - ./images:/app/images
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      payments:
        condition: service_started

  payments:
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    ports:
      - "8081:8081"
    environment:
      PAYMENT_INITIAL_BALANCE: ${PAYMENT_INITIAL_BALANCE:-100000.00}
      KEYCLOAK_ISSUER_URI: http://localhost:8180/realms/market
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/market/protocol/openid-connect/certs
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: ["start-dev", "--import-realm"]
    ports:
      - "127.0.0.1:8180:8080"
    environment:
      KC_HOSTNAME: http://localhost:8180
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      MARKET_CLIENT_SECRET: ${MARKET_CLIENT_SECRET:-market-local-secret}
    volumes:
      - ./keycloak/market-realm.json:/opt/keycloak/data/import/market-realm.json:ro
    healthcheck:
      test: >-
        exec bash -ec "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0;
        grep -q '^HTTP/1\.[01] 200[[:space:]]'; } 0<>/dev/tcp/127.0.0.1/9000"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: my_market_app
      POSTGRES_USER: market
      POSTGRES_PASSWORD: market
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
