server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: my-market-app
  r2dbc:
    url: ${R2DBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    properties:
      schema: ${DB_SCHEMA:public}
  liquibase:
    url: ${JDBC_URL}
    user: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    change-log: classpath:db/changelog/db.changelog-master.xml
    default-schema: ${DB_SCHEMA:public}
    parameters:
      appSchema: ${spring.liquibase.default-schema}
      insertDemoData: ${application.database.demo.insert-demo-data}

application:
  images:
    root: ${IMAGES_ROOT:images}
    default-image: ${IMAGES_DEFAULT_IMAGE:default-image.svg}
  database:
    demo:
      insert-demo-data: ${INSERT_DEMO_DATA:false}
