<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Регистрация</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<main class="container py-5" style="max-width: 32rem">
    <h1 class="h3 mb-4">Регистрация</h1>
    <p th:if="${error}" th:text="${error}" class="alert alert-danger" role="alert"></p>
    <form method="post" th:action="@{/register}">
        <label for="username" class="form-label">Логин</label>
        <input id="username" name="username" th:value="${username}" class="form-control mb-3"
               autocomplete="username" required minlength="3" maxlength="64">
        <label for="password" class="form-label">Пароль</label>
        <input id="password" name="password" type="password" class="form-control mb-3"
               autocomplete="new-password" required minlength="8">
        <button class="btn btn-primary" type="submit">Зарегистрироваться</button>
        <a class="btn btn-link" href="/login">Войти</a>
    </form>
</main>
</body>
</html>
