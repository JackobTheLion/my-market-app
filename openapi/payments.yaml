openapi: 3.0.3
info:
  title: Market payment service
  version: 2.0.0
  description: Per-customer accounts. Amounts and balances are expressed in RUB. Obtain a service token using OAuth2 Client Credentials.
security:
  - paymentsToken: []
paths:
  /api/balance:
    get:
      tags: [Payments]
      operationId: getBalance
      parameters:
        - name: userId
          in: query
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Current account balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400':
          description: Invalid account identifier
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'
        '401':
          description: Missing or invalid bearer token
  /api/payments:
    post:
      tags: [Payments]
      operationId: makePayment
      description: Each successful request debits the account by the specified amount.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Payment succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BalanceResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'
        '401':
          description: Missing or invalid bearer token
        '409':
          description: Insufficient funds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentError'
components:
  securitySchemes:
    paymentsToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    BalanceResponse:
      type: object
      required: [balance]
      properties:
        balance:
          type: number
          minimum: 0
    PaymentRequest:
      type: object
      required: [userId, amount]
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        amount:
          type: number
          description: Amount in RUB with at most 17 integral and 2 fractional digits, including trailing zeros.
          minimum: 0.01
          maximum: 99999999999999999.99
          multipleOf: 0.01
          # The generator does not derive a Bean Validation precision constraint from multipleOf.
          x-field-extra-annotation: '@jakarta.validation.constraints.Digits(integer = 17, fraction = 2)'
    PaymentError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
